# Railway service config for the PO-token helper.
# Create this as a separate Railway service using this Dockerfile, then set
# the main backend service variable YOUTUBE_GETPOT_BASE_URL to the provider's
# private URL if it is not running in the same container/network namespace.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/deploy/railway/bgutil-pot-provider.Dockerfile"

[deploy]

healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[variables]
PORT = "4416"