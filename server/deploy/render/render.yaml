services:
  - type: web
    name: mediahub-pro-api
    runtime: docker
    dockerfilePath: backend/deploy/docker/Dockerfile
    dockerContext: backend
    plan: starter
    healthCheckPath: /readyz
    disk:
      name: tmp
      mountPath: /app/tmp
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "5"
      - key: CORS_ORIGINS
        value: "*"